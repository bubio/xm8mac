name: macOS x86_64 (dev branch)

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  release:
    types: [published]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-13
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 15.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Build XM8 macOS app
        run: |
          cd Builder/macOS
          ./dist_app.sh
          mv ../../build/xm8.dmg ../../build/XM8_macOS_x86_64.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XM8_macOS_x86_64.dmg
          path: build/*.dmg