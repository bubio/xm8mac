name: macOS Build (dev branch)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Homebrew & CMake)
        run: |
          brew install cmake

      - name: Build XM8 macOS app
        run: |
          cd Builder/macOS
          ./dist_app.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XM8-macOS-app
          path: Builder/macOS/build/*.app