name: macOS Build (dev branch)

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  release:
    types: [published]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install dependencies (Homebrew & CMake)
        run: |
          brew install cmake

      - name: Build XM8 macOS app
        run: |
          cd Builder/macOS
          ./dist_app.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XM8_macOS_AppleSilicon
          path: build/*.dmg