name: Windows x86_64 (dev branch)

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  release:
    types: [published]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # SDL2 の最新VC向けZIPを取得
      - name: Download SDL2 VC release
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/libsdl-org/SDL/releases/latest
          $asset = $release.assets | Where-Object { $_.name -match "SDL2-devel-.*-VC\.zip" } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile SDL2.zip
          Expand-Archive SDL2.zip -DestinationPath SDL2_tmp
          New-Item -ItemType Directory -Path "Builder/Windows/SDL" -Force | Out-Null
          Copy-Item SDL2_tmp\SDL2-*\include "Builder/Windows/SDL/include" -Recurse -Force
          Copy-Item SDL2_tmp\SDL2-*\lib\x86 "Builder/Windows/SDL/lib/x86" -Recurse -Force
          Copy-Item SDL2_tmp\SDL2-*\lib\x64 "Builder/Windows/SDL/lib/x64" -Recurse -Force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # x64 ビルド
      - name: Build XM8 (x64)
        run: msbuild Builder/Windows/XM8.sln /p:Configuration=Release /p:Platform=x64

      # Win32 ビルド
      - name: Build XM8 (Win32)
        run: msbuild Builder/Windows/XM8.sln /p:Configuration=Release /p:Platform=Win32

      - name: Collect Artifacts
        run: |
          mkdir artifacts_x64
          copy Builder\Windows\x64\Release\XM8.exe artifacts_x64\
          copy Builder\Windows\SDL\lib\x64\SDL2.dll artifacts_x64\
          mkdir artifacts_Win32
          copy Builder\Windows\Win32\Release\XM8.exe artifacts_Win32\
          copy Builder\Windows\SDL\lib\x86\SDL2.dll artifacts_Win32\

      - name: Upload Artifacts (x64)
        uses: actions/upload-artifact@v4
        with:
          name: XM8_Windows_x64
          path: artifacts_x64/**

      - name: Upload Artifacts (Win32)
        uses: actions/upload-artifact@v4
        with:
          name: XM8_Windows_Win32
          path: artifacts_Win32/**