name: Windows x86_64 (dev branch)

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  release:
    types: [published]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # SDL2 の最新VC向けZIPを取得
      - name: Download SDL2 VC 2.32.8
        shell: pwsh
        run: |
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-2.32.8/SDL2-devel-2.32.8-VC.zip"
          Invoke-WebRequest $url -OutFile SDL2.zip
          Expand-Archive SDL2.zip -DestinationPath SDL2_tmp
          New-Item -ItemType Directory -Path "Builder/Windows/SDL/include" -Force | Out-Null
          New-Item -ItemType Directory -Path "Builder/Windows/SDL/lib/x86" -Force | Out-Null
          New-Item -ItemType Directory -Path "Builder/Windows/SDL/lib/x64" -Force | Out-Null
          Copy-Item SDL2_tmp\SDL2-2.32.8\include\* "Builder/Windows/SDL/include" -Recurse -Force
          Copy-Item SDL2_tmp\SDL2-2.32.8\lib\x86\* "Builder/Windows/SDL/lib/x86" -Recurse -Force
          Copy-Item SDL2_tmp\SDL2-2.32.8\lib\x64\* "Builder/Windows/SDL/lib/x64" -Recurse -Force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # x64 ビルド
      - name: Build XM8 (x64)
        run: msbuild Builder/Windows/XM8.sln /p:Configuration=Release /p:Platform=x64

      # Win32 ビルド
      - name: Build XM8 (Win32)
        run: msbuild Builder/Windows/XM8.sln /p:Configuration=Release /p:Platform=Win32

      - name: Collect Artifacts
        run: |
          mkdir artifacts_x64
          copy Builder\Windows\x64\Release\XM8.exe artifacts_x64\
          copy Builder\Windows\SDL\lib\x64\SDL2.dll artifacts_x64\
          mkdir artifacts_Win32
          copy Builder\Windows\Win32\Release\XM8.exe artifacts_Win32\
          copy Builder\Windows\SDL\lib\x86\SDL2.dll artifacts_Win32\

      - name: Create ZIP archives
        run: |
          powershell Compress-Archive -Path artifacts_x64\* -DestinationPath XM8_Windows_x86_64.zip
          powershell Compress-Archive -Path artifacts_Win32\* -DestinationPath XM8_Windows_x86_32.zip

      - name: Upload Artifacts (XM8_Windows_x86_64.zip)
        uses: actions/upload-artifact@v4
        with:
          name: XM8_Windows_x86_64
          path: XM8_Windows_x86_64.zip

      - name: Upload Artifacts (XM8_Windows_x86_32.zip)
        uses: actions/upload-artifact@v4
        with:
          name: XM8_Windows_x86_32
          path: XM8_Windows_x86_32.zip