name: Linux arm64 Flatpak

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flatpak builder
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: XM8_Linux_arm64.flatpak
          manifest-path: com.github.bubio.xm8m.yml
          cache-key: flatpak-arm64-${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: XM8_Linux_arm64.flatpak
          path: XM8_Linux_arm64.flatpak

      - name: Update Release
        if: ${{ github.event_name == 'release' && !env.ACT }}
        uses: svenstaro/upload-release-action@v2
        with:
          file: XM8_Linux_arm64.flatpak
          overwrite: true
